# T187 — «마지막으로 유니티 잡이 초록이던 커밋» 을 주기적으로 gh-pages 에 올린다.
#
# 왜 필요한가(실측 · ROUTINE §2 T187): 워커가 열둘로 늘어 2~3분마다 push 가 들어오고 커밋마다 새 PlayMode 단언이 붙는다.
# 파이프라인은 유니티 잡 8분 + WebGL 15분이라 「머리 커밋이 **모든** 단언을 통과」할 확률이 0 에 가까워졌다 —
# #284~#345 예순두 런에 초록 0, gh-pages 는 06:59 에 멈췄다. 아무도 빨강을 방치해서가 아니라, 고치는 사이 다음 워커의
# 새 단언이 또 빨개져 «초록 순간» 이 안 생기기 때문이다(결함이 아니라 산수다).
#
# 원칙은 그대로 지킨다 — **폰에 가는 것은 여전히 «유니티 잡이 초록이던 커밋» 이다.** ci.yml 의 `needs: [unity-test]` 는
# 한 글자도 안 건드렸다(빨간 머리 커밋은 여전히 배포되지 않는다). 이 워크플로는 «머리» 대신 «가장 최근 초록» 을 고를 뿐이다.
# 게다가 배포 스모크(T60)를 그대로 지나므로 실제로 열리는 빌드만 나간다.
name: 마지막 초록 커밋 배포 (gh-pages · T187)

on:
  # ⚠ T276 회차 2(2026-09-08 21:3X 실측) — **한 시간 전의 내 진단이 틀렸고, 그 고침을 되돌린다.**
  #   20:32 에 나는 «런 207~216 열 개 연속 cancelled» 를 보고 «방아쇠(workflow_run)가 너무 잦아
  #   대기 런이 계속 밀린다» 로 읽고 크론 하나로 갈았다. 취소의 줄은 사실이었지만 **까닭이 아니었다.**
  #
  #   실측(21:30):
  #     · 런 206 의 굽기 잡이 `game-ci/unity-builder@v4` 에서 **19:34:34 부터 1시간 56분째 in_progress** —
  #       보통 12분짜리 단계다. 이 잡에 `timeout-minutes` 가 없어 기본 **6시간**까지 안 죽는다.
  #     · 즉 그 한 잡이 `concurrency` 그룹을 붙들고 있었고, 뒤에 선 런은 «대기 하나» 자리를 서로
  #       밀어내며 전부 취소된 것이다. 취소는 증상이고 원인은 **죽지 않는 잡** 이었다.
  #     · 그 줄 바로 앞 런 204·205 는 success 다 — 방아쇠가 잦아서 «한 번도 못 굽는» 구조였다면
  #       그 둘도 없어야 했다. 열 개만 보고 그 앞을 안 센 것이 내 오독이다.
  #   그리고 크론은 이번에도 **한 번도 안 떴다**: 20:45 · 21:00 · 21:15 세 틱 모두 런이 안 생겼다
  #   (T187 회차 2 가 13:25 · 14:25 로 이미 잰 것과 같다 — 이 레포에서 schedule 은 조용히 건너뛴다).
  #   ⇒ 한 시간 동안 이 워크플로는 **방아쇠가 아예 없는 상태**였다. 되돌리는 것이 맞다.
  #
  #   ⇒ ⓐ `workflow_run` 을 정본으로 되돌리고(실제로 뜨는 유일한 방아쇠다)
  #      ⓑ 크론은 안전망으로만 남기고(밤에 CI 가 멈춰 있을 때용 · 뜨면 좋고 안 떠도 잃는 것 없다)
  #      ⓒ 진짜 고침은 아래 두 잡의 **`timeout-minutes`** 다 — 이제 굽기가 막혀도 40분이면 죽고
  #         그룹이 풀려 다음 런이 굽는다. 6시간짜리 정지는 다시 안 난다.
  workflow_run:
    workflows: ['CI']
    types: [completed]
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

concurrency:
  # ci.yml 과 **다른** 그룹이다 — 같은 그룹으로 두면 포화된 CI 큐 뒤에 서서 영영 안 도는데, 그것이 이 작업이 고치려는 바로 그 문제다.
  # 유니티 잡을 동시에 돌리는 것은 ci.yml 이 이미 하고 있다(unity-test 뒤 build-webgl·build-android 가 나란히 돈다).
  group: deploy-last-green
  cancel-in-progress: false

permissions:
  contents: write   # gh-pages 배포
  actions: read     # 지난 런의 잡 결과를 읽어 «마지막 초록» 을 고른다

jobs:
  pick:
    name: 마지막 «유니티 잡 초록» 커밋 고르기
    runs-on: ubuntu-latest
    # T276 회차 2 — 이 잡은 API 몇 번이라 보통 6초에 끝난다. 막히면 5분에 죽는다.
    timeout-minutes: 5
    outputs:
      sha: ${{ steps.pick.outputs.sha }}
      run: ${{ steps.pick.outputs.run }}
      go: ${{ steps.pick.outputs.go }}
    steps:
      - id: pick
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # T298 — 문지기는 **아래 굽기 잡이 실제로 쓰는 것**을 본다. 그것은 `UNITY_LICENSE` 다
          #   (`unity-builder@v4` 는 계정 방식을 안 받는다 · 까닭은 그 잡의 env 주석).
          #   T297 이 여기를 EMAIL·PASSWORD 로 바꿨는데, 그러면 라이선스가 없어도 문지기가 통과시켜
          #   **굽기가 30초 만에 죽는 런을 20분마다 만든다**(런 324·326).
          #   ⚠ T297 이 걱정한 것(«주인이 T283 뒷정리로 이 시크릿을 지우면 영영 조용히 건너뛴다»)은 진짜다.
          #     다만 답은 «안 보는 것» 이 아니다 — 굽기가 그 파일 없이는 못 도니, 없으면 서는 것이 옳다.
          #     그래서 건너뛸 때의 알림에 **«지우지 마라» 를 적어 둔다**(아래 notice).
          LIC: ${{ secrets.UNITY_LICENSE }}
        run: |
          set -euo pipefail
          if [ -z "$LIC" ]; then echo "go=false" >> "$GITHUB_OUTPUT"; echo "::notice::UNITY_LICENSE 시크릿이 없어 건너뛴다 — 이 워크플로의 unity-builder 는 계정(EMAIL/PASSWORD) 방식을 안 받는다(T298). ci.yml 이 그 시크릿을 안 쓴다고 해서 지우면 폰 빌드만 조용히 멈춘다."; exit 0; fi
          # 지금 gh-pages 에 올라가 있는 소스 커밋(배포 커밋 메시지에 sha 를 적어 둔다)
          cur=$(gh api "repos/$GITHUB_REPOSITORY/commits/gh-pages" --jq '.commit.message' 2>/dev/null | head -1 | grep -oE '[0-9a-f]{40}' | head -1 || true)
          echo "지금 배포된 커밋: ${cur:-(없음)}"
          # main 의 최근 런을 새것부터 훑어 «유니티 잡 conclusion == success» 인 첫 커밋을 고른다.
          # 30개로 끊는 까닭: 런 하나마다 jobs API 를 한 번 부르는데 이 워크플로가 CI 가 끝날 때마다 돈다 —
          # 100개씩 훑으면 초록이 없는 동안 시간당 2천 번이 되어 GITHUB_TOKEN 시간당 한도(1000)를 넘긴다. 30개면 최근 ~1.5시간을 덮는다.
          # 런 전체(conclusion)가 아니라 **그 잡 하나**를 본다 — WebGL·Android 가 다른 까닭으로 빨개도 «테스트는 초록» 이면 폰에 보내도 되는 빌드다.
          found=""; foundrun=""
          while read -r id sha; do
            [ -n "$id" ] || continue
            ok=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$id/jobs?per_page=30" \
                   --jq '[.jobs[] | select(.name | test("Unity")) | .conclusion] | index("success") // empty' 2>/dev/null || true)
            if [ -n "$ok" ]; then found="$sha"; foundrun="$id"; break; fi
          done < <(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?branch=main&per_page=30" \
                     --jq '.workflow_runs[] | "\(.id) \(.head_sha)"')
          if [ -z "$found" ]; then
            echo "go=false" >> "$GITHUB_OUTPUT"
            echo "::warning::최근 30 런에 «유니티 잡 초록» 이 하나도 없다 — 배포할 것이 없다"
            exit 0
          fi
          echo "고른 커밋: $found (런 $foundrun)"
          if [ "$found" = "${cur:-}" ]; then
            echo "go=false" >> "$GITHUB_OUTPUT"
            echo "::notice::이미 그 커밋이 배포돼 있다 — 굽지 않는다"
            exit 0
          fi
          # ⚠ 뒤로 되돌리지 않는다 — ci.yml 이 «머리가 초록» 이라 방금 더 새 커밋을 배포했는데
          # 내가 그보다 «오래된 초록» 을 골라 덮으면 주인 폰이 뒤로 간다(두 워크플로가 나란히 도는 구조의 유일한 위험).
          # 그래서 고른 커밋이 지금 배포된 것보다 «앞서 있는가» 를 한 번 묻는다(ahead 일 때만 굽는다).
          if [ -n "${cur:-}" ]; then
            rel=$(gh api "repos/$GITHUB_REPOSITORY/compare/$cur...$found" --jq '.status' 2>/dev/null || echo "unknown")
            echo "배포된 것 ↔ 고른 것: $rel"
            if [ "$rel" != "ahead" ]; then
              echo "go=false" >> "$GITHUB_OUTPUT"
              echo "::notice::고른 커밋이 지금 배포된 것보다 새롭지 않다($rel) — 뒤로 되돌리지 않는다"
              exit 0
            fi
          fi
          { echo "sha=$found"; echo "run=$foundrun"; echo "go=true"; } >> "$GITHUB_OUTPUT"

  deploy:
    name: 그 커밋으로 WebGL 굽고 gh-pages 로
    needs: [pick]
    if: needs.pick.outputs.go == 'true'
    runs-on: ubuntu-latest
    # ⚠ T276 회차 2 — **이 한 줄이 그 회차의 본체다.**
    #   없으면 기본이 6시간이고, `game-ci/unity-builder` 가 한 번 멈추면 그 6시간 동안
    #   `concurrency: deploy-last-green` 을 붙든 채 뒤에 오는 런을 전부 취소시킨다(2026-09-08 2시간 실측).
    #
    #   ⚠ T276 회차 3(22:3X) — **40 → 70 으로 올렸다. 40 을 «실측의 3~5배» 라 적은 것이 틀렸다.**
    #     이 잡의 실제 길이(잡 시작~끝 · 대기 시간은 안 센다):
    #       런 221  21분 06초 (그중 unity-builder 17분 41초 · 캐시 맞음)
    #       런 218  약 28분   (캐시가 식은 쪽)
    #     즉 40분은 **1.4~1.9배**밖에 안 됐다 — 캐시가 식고 러너가 느린 날이면 성한 런을 죽인다.
    #     («굽기 12분» 은 T187 을 세울 때의 값이고 그 뒤로 화면·자가 늘며 길어졌다.
    #      주석의 수는 늙는다 — 자물쇠를 걸 때는 **그 자리를 다시 재고 건다.**)
    #     70분이면 최악 실측의 2.5배이고, 그러면서도 멈춘 잡을 기본값보다 **5배 빨리** 죽인다
    #     (이 줄의 목적은 «빨리 죽이기» 가 아니라 «6시간을 안 붙들기» 다).
    #   죽으면 그 런만 빨갛고 그룹이 풀려 다음 CI 완료가 다시 굽는다 — 배포가 다시 흐른다.
    timeout-minutes: 70
    steps:
      # ⚠ 머리(main)가 아니라 **고른 커밋**을 체크아웃한다 — 이 워크플로의 핵심 한 줄이다.
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.pick.outputs.sha }}
      - uses: actions/cache@v4
        with:
          path: Library
          key: Library-WebGL-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            Library-WebGL-
            Library-
      - uses: game-ci/unity-builder@v4
        env:
          # ⛔ T298 — **여기서는 UNITY_LICENSE 를 빼지 마라. ci.yml 과 반대다.**
          #   T297 이 ci.yml 의 T283 고침을 이 자리에 그대로 옮겼다가 **폰 빌드를 껐다.**
          #   두 액션이 다르기 때문이다:
          #     · `unity-test-runner@v4` — 계정(UNITY_EMAIL·UNITY_PASSWORD) 방식을 **받는다** ⇒ ci.yml 은 라이선스를 빼는 것이 옳다(T283).
          #     · `unity-builder@v4`     — **안 받는다.** 라이선스 파일이나 시리얼이 없으면 굽기 30초 만에
          #         «Missing Unity License File and no Serial was found» 로 죽는다.
          #   대조군(2026-09-09 실측 · 같은 날 같은 시크릿):
          #     배포 런 322(08:14 · 라이선스 **있음**) = 굽기 20분 + 스모크 + gh-pages 밀기까지 전부 success
          #     배포 런 324·326(08:16 · T297 로 라이선스 **없음**) = 위 오류로 즉사
          #   ⇒ EMAIL·PASSWORD 는 그대로 두되(있어서 해로울 것 없다) **LICENSE 가 이 잡의 열쇠다.**
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: .
          targetPlatform: WebGL
          buildName: KkomaKnight
          buildsPath: build
          allowDirtyBuild: true
      # T60 배포 스모크 — ci.yml 과 **같은 자**를 그대로 지난다(빨강이면 아래 배포 step 이 안 돈다).
      - name: "배포 스모크 (T60 · headless chromium · 콘솔 에러 0 · 로비 · 전투) — 빨강이면 배포 안 함"
        run: |
          sudo chown -R "$(id -u):$(id -g)" build || true
          npm i -g playwright@1.56.1
          npx playwright install --with-deps chromium
          tools/webgl_smoke.sh --dir build/WebGL/KkomaKnight --battle --require-marker --timeout 240 --shot webgl-smoke/local.png --log webgl-smoke/local.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: webgl-smoke-lastgreen
          path: webgl-smoke/
          if-no-files-found: ignore
      # ⚠ T208 — **밀기 «직전» 에 한 번 더 묻는다.** `pick` 의 `compare` 는 6초짜리 판단이고 이 잡은 그 뒤 **11분**을 굽는다
      # (실측 · 워커 H: 17:20:16 «ahead» → 17:20:50~17:32:08 빌드 → 그 사이 **17:27** 에 ci.yml 이 먼저 배포).
      # 그러니 «앞서 있는가» 를 굽기 전에만 물으면, 굽는 사이에 ci.yml 이 더 새 커밋을 올린 경우를 **못 막는다** —
      # 그것이 이 자물쇠가 애초에 막으려던 사고(주인 폰이 뒤로 가는 것) 그 자체다. 그래서 같은 물음을 여기서 되풀이한다.
      # 오늘은 두 워크플로가 같은 sha 를 골라 무해했지만, 다른 sha 였다면 11분 뒤의 덮어쓰기가 그대로 회귀였다.
      - id: recheck
        name: "밀기 직전 되묻기 (굽는 11분 사이에 ci.yml 이 더 새 것을 배포했나 · T208)"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          want='${{ needs.pick.outputs.sha }}'
          cur=$(gh api "repos/$GITHUB_REPOSITORY/commits/gh-pages" --jq '.commit.message' 2>/dev/null | head -1 | grep -oE '[0-9a-f]{40}' | head -1 || true)
          echo "지금 배포된 것: ${cur:-(없음)} · 내가 구운 것: $want"
          # ⚠ `set -e` 아래에서 «[ … ] && { … }» 꼴로 갈래를 만들면, 조건이 거짓일 때 그 줄이 1 을 돌려 **step 이 통째로 실패**한다.
          #    배포를 지키는 자가 제 갈래 때문에 빨개지면 안 되므로 여기서는 if/else 만 쓴다.
          if [ "${cur:-}" = "$want" ]; then
            # 굽는 사이에 상대가 **바로 이 커밋**을 올렸다 — 다시 밀 까닭이 없다(오늘 17:33 이 그 꼴이었다).
            echo "go=false" >> "$GITHUB_OUTPUT"
            echo "::notice::굽는 사이에 같은 커밋이 이미 배포됐다 — 다시 밀지 않는다"
            exit 0
          fi
          if [ -z "${cur:-}" ]; then
            # 배포 커밋에서 sha 를 못 읽는다(첫 배포이거나 메시지 꼴이 바뀌었다) → pick 이 이미 «ahead» 를 봤으니 굽던 대로 민다.
            echo "go=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          rel=$(gh api "repos/$GITHUB_REPOSITORY/compare/$cur...$want" --jq '.status' 2>/dev/null || echo "unknown")
          echo "배포된 것 ↔ 내가 구운 것: $rel"
          if [ "$rel" = "ahead" ]; then
            echo "go=true" >> "$GITHUB_OUTPUT"
          else
            echo "go=false" >> "$GITHUB_OUTPUT"
            echo "::warning::굽는 사이에 gh-pages 가 $cur 로 움직였고 내 것이 그보다 새롭지 않다($rel) — 뒤로 되돌리지 않는다(T208)"
          fi
      - name: "gh-pages 로 배포 (마지막 초록 커밋)"
        if: steps.recheck.outputs.go == 'true'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: build/WebGL/KkomaKnight
          publish_branch: gh-pages
          force_orphan: true
          # 커밋 메시지의 40자 sha 를 다음 회차의 pick 이 다시 읽는다(같은 커밋을 두 번 굽지 않게) — 꼴을 바꾸지 말 것.
          commit_message: 'WebGL 배포 ${{ needs.pick.outputs.sha }} (마지막 초록 · T187 · 런 ${{ needs.pick.outputs.run }})'
      # 안 밀었으면 재확인도 안 한다 — 그 스모크는 «내가 방금 올린 것» 을 보는 자다(남이 올린 것을 내 이름으로 판정하지 않는다 · T208).
      - name: "배포 뒤 gh-pages 재확인 (같은 스모크 · 재시도 5회)"
        if: steps.recheck.outputs.go == 'true'
        run: tools/webgl_smoke.sh https://kuzuni.github.io/aaawunity/ --battle --require-marker --retries 5 --timeout 240 --shot webgl-smoke/ghpages.png --log webgl-smoke/ghpages.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: webgl-smoke-lastgreen-ghpages
          path: webgl-smoke/ghpages.*
          if-no-files-found: ignore
