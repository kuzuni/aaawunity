# T187 — «마지막으로 유니티 잡이 초록이던 커밋» 을 주기적으로 gh-pages 에 올린다.
#
# 왜 필요한가(실측 · ROUTINE §2 T187): 워커가 열둘로 늘어 2~3분마다 push 가 들어오고 커밋마다 새 PlayMode 단언이 붙는다.
# 파이프라인은 유니티 잡 8분 + WebGL 15분이라 「머리 커밋이 **모든** 단언을 통과」할 확률이 0 에 가까워졌다 —
# #284~#345 예순두 런에 초록 0, gh-pages 는 06:59 에 멈췄다. 아무도 빨강을 방치해서가 아니라, 고치는 사이 다음 워커의
# 새 단언이 또 빨개져 «초록 순간» 이 안 생기기 때문이다(결함이 아니라 산수다).
#
# 원칙은 그대로 지킨다 — **폰에 가는 것은 여전히 «유니티 잡이 초록이던 커밋» 이다.** ci.yml 의 `needs: [unity-test]` 는
# 한 글자도 안 건드렸다(빨간 머리 커밋은 여전히 배포되지 않는다). 이 워크플로는 «머리» 대신 «가장 최근 초록» 을 고를 뿐이다.
# 게다가 배포 스모크(T60)를 그대로 지나므로 실제로 열리는 빌드만 나간다.
name: 마지막 초록 커밋 배포 (gh-pages · T187)

on:
  # ⚠ `schedule` 만으로는 안 돌았다(실측 · 13:25·14:25 두 틱 다 안 뜸 · 13:30 수동 실행만 기록에 있다).
  # 새로 넣은 크론이 등록되기까지 걸리거나 조용히 건너뛰는 일이 잦아 «배포가 다시 흐르는가» 를 크론에 걸어 두면 안 된다.
  # 그래서 **CI 가 끝날 때마다** 도는 방아쇠를 정본으로 삼는다 — 초록이 생긴 «바로 그 순간» 다음 회에 배포된다(대기 ≈ 0).
  # 할 일이 없으면 pick 이 30초 안에 «굽지 않음» 으로 끝나므로 자주 도는 것이 비싸지 않다.
  workflow_run:
    workflows: ['CI']
    types: [completed]
  schedule:
    # 그래도 크론을 남겨 둔다 — CI 가 한동안 안 돌아도(밤·주말) 마지막 초록을 놓치지 않는 안전망이다.
    - cron: '25 * * * *'
  workflow_dispatch:

concurrency:
  # ci.yml 과 **다른** 그룹이다 — 같은 그룹으로 두면 포화된 CI 큐 뒤에 서서 영영 안 도는데, 그것이 이 작업이 고치려는 바로 그 문제다.
  # 유니티 잡을 동시에 돌리는 것은 ci.yml 이 이미 하고 있다(unity-test 뒤 build-webgl·build-android 가 나란히 돈다).
  group: deploy-last-green
  cancel-in-progress: false

permissions:
  contents: write   # gh-pages 배포
  actions: read     # 지난 런의 잡 결과를 읽어 «마지막 초록» 을 고른다

jobs:
  pick:
    name: 마지막 «유니티 잡 초록» 커밋 고르기
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.pick.outputs.sha }}
      run: ${{ steps.pick.outputs.run }}
      go: ${{ steps.pick.outputs.go }}
    steps:
      - id: pick
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LIC: ${{ secrets.UNITY_LICENSE }}
        run: |
          set -euo pipefail
          if [ -z "$LIC" ]; then echo "go=false" >> "$GITHUB_OUTPUT"; echo "::notice::유니티 시크릿이 없어 건너뛴다"; exit 0; fi
          # 지금 gh-pages 에 올라가 있는 소스 커밋(배포 커밋 메시지에 sha 를 적어 둔다)
          cur=$(gh api "repos/$GITHUB_REPOSITORY/commits/gh-pages" --jq '.commit.message' 2>/dev/null | head -1 | grep -oE '[0-9a-f]{40}' | head -1 || true)
          echo "지금 배포된 커밋: ${cur:-(없음)}"
          # main 의 최근 런을 새것부터 훑어 «유니티 잡 conclusion == success» 인 첫 커밋을 고른다.
          # 30개로 끊는 까닭: 런 하나마다 jobs API 를 한 번 부르는데 이 워크플로가 CI 가 끝날 때마다 돈다 —
          # 100개씩 훑으면 초록이 없는 동안 시간당 2천 번이 되어 GITHUB_TOKEN 시간당 한도(1000)를 넘긴다. 30개면 최근 ~1.5시간을 덮는다.
          # 런 전체(conclusion)가 아니라 **그 잡 하나**를 본다 — WebGL·Android 가 다른 까닭으로 빨개도 «테스트는 초록» 이면 폰에 보내도 되는 빌드다.
          found=""; foundrun=""
          while read -r id sha; do
            [ -n "$id" ] || continue
            ok=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$id/jobs?per_page=30" \
                   --jq '[.jobs[] | select(.name | test("Unity")) | .conclusion] | index("success") // empty' 2>/dev/null || true)
            if [ -n "$ok" ]; then found="$sha"; foundrun="$id"; break; fi
          done < <(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?branch=main&per_page=30" \
                     --jq '.workflow_runs[] | "\(.id) \(.head_sha)"')
          if [ -z "$found" ]; then
            echo "go=false" >> "$GITHUB_OUTPUT"
            echo "::warning::최근 30 런에 «유니티 잡 초록» 이 하나도 없다 — 배포할 것이 없다"
            exit 0
          fi
          echo "고른 커밋: $found (런 $foundrun)"
          if [ "$found" = "${cur:-}" ]; then
            echo "go=false" >> "$GITHUB_OUTPUT"
            echo "::notice::이미 그 커밋이 배포돼 있다 — 굽지 않는다"
            exit 0
          fi
          # ⚠ 뒤로 되돌리지 않는다 — ci.yml 이 «머리가 초록» 이라 방금 더 새 커밋을 배포했는데
          # 내가 그보다 «오래된 초록» 을 골라 덮으면 주인 폰이 뒤로 간다(두 워크플로가 나란히 도는 구조의 유일한 위험).
          # 그래서 고른 커밋이 지금 배포된 것보다 «앞서 있는가» 를 한 번 묻는다(ahead 일 때만 굽는다).
          if [ -n "${cur:-}" ]; then
            rel=$(gh api "repos/$GITHUB_REPOSITORY/compare/$cur...$found" --jq '.status' 2>/dev/null || echo "unknown")
            echo "배포된 것 ↔ 고른 것: $rel"
            if [ "$rel" != "ahead" ]; then
              echo "go=false" >> "$GITHUB_OUTPUT"
              echo "::notice::고른 커밋이 지금 배포된 것보다 새롭지 않다($rel) — 뒤로 되돌리지 않는다"
              exit 0
            fi
          fi
          { echo "sha=$found"; echo "run=$foundrun"; echo "go=true"; } >> "$GITHUB_OUTPUT"

  deploy:
    name: 그 커밋으로 WebGL 굽고 gh-pages 로
    needs: [pick]
    if: needs.pick.outputs.go == 'true'
    runs-on: ubuntu-latest
    steps:
      # ⚠ 머리(main)가 아니라 **고른 커밋**을 체크아웃한다 — 이 워크플로의 핵심 한 줄이다.
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.pick.outputs.sha }}
      - uses: actions/cache@v4
        with:
          path: Library
          key: Library-WebGL-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            Library-WebGL-
            Library-
      - uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: .
          targetPlatform: WebGL
          buildName: KkomaKnight
          buildsPath: build
          allowDirtyBuild: true
      # T60 배포 스모크 — ci.yml 과 **같은 자**를 그대로 지난다(빨강이면 아래 배포 step 이 안 돈다).
      - name: "배포 스모크 (T60 · headless chromium · 콘솔 에러 0 · 로비 · 전투) — 빨강이면 배포 안 함"
        run: |
          sudo chown -R "$(id -u):$(id -g)" build || true
          npm i -g playwright@1.56.1
          npx playwright install --with-deps chromium
          tools/webgl_smoke.sh --dir build/WebGL/KkomaKnight --battle --require-marker --timeout 240 --shot webgl-smoke/local.png --log webgl-smoke/local.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: webgl-smoke-lastgreen
          path: webgl-smoke/
          if-no-files-found: ignore
      - name: "gh-pages 로 배포 (마지막 초록 커밋)"
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: build/WebGL/KkomaKnight
          publish_branch: gh-pages
          force_orphan: true
          # 커밋 메시지의 40자 sha 를 다음 회차의 pick 이 다시 읽는다(같은 커밋을 두 번 굽지 않게) — 꼴을 바꾸지 말 것.
          commit_message: 'WebGL 배포 ${{ needs.pick.outputs.sha }} (마지막 초록 · T187 · 런 ${{ needs.pick.outputs.run }})'
      - name: "배포 뒤 gh-pages 재확인 (같은 스모크 · 재시도 5회)"
        run: tools/webgl_smoke.sh https://kuzuni.github.io/aaawunity/ --battle --require-marker --retries 5 --timeout 240 --shot webgl-smoke/ghpages.png --log webgl-smoke/ghpages.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: webgl-smoke-lastgreen-ghpages
          path: webgl-smoke/ghpages.*
          if-no-files-found: ignore
