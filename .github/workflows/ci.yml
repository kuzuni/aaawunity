# CI — 시크릿(UNITY_EMAIL·UNITY_PASSWORD)이 없으면 dotnet 검사만 돌고 초록이어야 한다.
# 시크릿이 있으면: PR·push 마다 EditMode/PlayMode 테스트, main 에 push 될 때만 WebGL 빌드 → gh-pages 배포 + Android APK Artifact.
name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false   # 워커 4개가 15분마다 푸시하면 취소가 이어져 WebGL 배포가 영영 안 끝난다 → 직렬 대기(gh-pages 최우선)

permissions:
  contents: write   # gh-pages 배포
  checks: write     # T295 — unity-test-runner 가 «Test Results» 체크 런을 만들 때 쓴다(아래 unity-test 의 githubToken 주석과 한 벌).

jobs:
  dotnet:
    name: dotnet 컴파일 · 순수 C# 테스트 · 데이터 동기화 · .meta 검사
    runs-on: ubuntu-latest
    # T276 회차 2 — `timeout-minutes` 가 없으면 기본이 **6시간**이다. 유니티 잡이 한 번 멈추면
    #   `concurrency: ci-<ref>`(cancel-in-progress: false)를 그 6시간 동안 붙들어 **CI 큐 전체가 선다** —
    #   오늘 배포 워크플로에서 같은 꼴을 2시간 실측했다(런 206 · unity-builder 에서 1시간 56분 in_progress).
    #   ⚠ 회차 3(22:3X) — 수를 «짐작» 이 아니라 **실측**으로 다시 맞췄다(런 591 · 잡 시작~끝):
    #     gate 3초(→5) · dotnet 38초(→20) · unity-test **9분 42초**(→45 · 4.6배).
    #     build-webgl·build-android 은 지금 수동 실행 전용이라 잴 런이 없어 **60 → 90** 으로 올렸다 —
    #     같은 굽기가 배포 워크플로에서 21~28분이고 그쪽은 안드로이드까지 굽는다.
    #     못 잰 자리는 **넉넉하게** 잡는다: 이 줄의 목적은 «빨리 죽이기» 가 아니라 «6시간을 안 붙들기» 다.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          # T347 — `check_claim_scope` 는 «그 작업의 커밋이 실제로 만진 파일» 을 이력에서 읽는다.
          #   checkout 기본값은 `fetch-depth: 1`(얕은 클론)이라 이력이 통째로 없고, 그러면 그 자는
          #   **아무 말도 못 하면서 조용히 초록**이 된다(그 꼴을 막으려고 자가 «못 봤다» 고 말하게 해 뒀다).
          #   `0`(전부) 대신 **300** 인 까닭: lock 은 90분이면 죽으므로 볼 이력은 늘 최근 몇 시간뿐인데,
          #   이 레포는 유니티 에셋을 들고 있어 전체 이력은 blob 이 무겁다. 300 이면 워커 12개 속도로도 하루치가 넘는다.
          fetch-depth: 300
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: dotnet build (UnityEngine 참조 어셈블리 · NuGet)
        run: dotnet build tools/dotnet/KkomaKnight.sln -c Release --nologo
      - name: dotnet test (EditMode 의 순수 C# 테스트)
        run: dotnet test tools/dotnet/Tests/KkomaKnight.Tests.csproj -c Release --no-build --nologo --logger "trx;LogFileName=results.trx"
      - name: .meta 누락/고아 검사
        run: python3 tools/gen_meta.py --check
      - name: 코드의 카탈로그 키 ↔ catalog.json 대조 (플레이 콘솔 에러 0 게이트 · T12)
        run: python3 tools/check_catalog_keys.py
      # T211 — 게임이 런타임에 읽는 것은 catalog.json 이 아니라 **거기서 생성된** AssetCatalog.asset 이다.
      # «json 에 키를 넣고 생성기를 안 돌린» 상태는 위 두 자를 그대로 통과하고, 부팅이 그 키를 못 찾아
      # `[Error] … 카탈로그에 없다` 한 줄로 **부팅을 지나는 PlayMode 가 전부** 빨개진다(CI #412 에서 93건 · 배포도 같이 멈췄다).
      # 그 빨강은 어차피 나므로 이 자는 «새로 막는» 자가 아니라 **8분 먼저 · 고칠 방법을 적어서** 알리는 자다(결정 493 기준).
      - name: 카탈로그 생성물이 최신인가 (AssetCatalog.asset · assets-map · T211)
        run: python3 tools/gen_catalog.py --check
      - name: 유니티 가짜 null 패턴 검사 («GetComponent…() ??»·«Find(…) ??» 0건 · T11)
        run: tools/check_unity_null.sh
      # T188(주인 상시 지시 2026-09-07 «컴파일 에러 항상 확인하고 해결하고 넘어가라») — asmdef 참조가 빠지면
      # 유니티 잡이 «컴파일 단계에서» 죽어 테스트가 0개가 된다(빨간 테스트보다 나쁘고 screens·gh-pages 도 같이 막힌다).
      # 이 잡은 유니티 라이선스가 없어도 도는 자리라 시크릿 없는 PR·포크에서도 먼저 걸린다.
      - name: asmdef 참조 검사 (using ↔ asmdef references · T189) + 자기 검사
        run: |
          python3 tools/check_asmdef.py --self-test
          python3 tools/check_asmdef.py
      - name: 테스트 어셈블리 using 검사 (참조 없는 네임스페이스 · T188)
        run: python3 tools/check_test_usings.py
      # T193 — «PROGRESS 는 ✅ 완료인데 ROUTINE §2 제목에는 ✅ 가 없다» = 다음 워커가 끝난 일을 다시 잡는 덫.
      # ⚠ **일부러 `continue-on-error` 다.** 이 잡이 빨개지면 `unity-test` → `build-webgl` 이 줄줄이 안 돌아
      # **주인 폰 배포가 막힌다**(needs 사슬). ✅ 하나가 빠진 것은 «조율 결함» 이지 «빌드 결함» 이 아니라,
      # 폰을 볼모로 잡을 값어치가 없다 — 로그와 주황 표시로 보이게만 하고 막지는 않는다(결정 493).
      # 자기 검사는 순수 함수라 문서 어긋남과 무관하니 그대로 막는다.
      - name: 작업 상태 대조 (ROUTINE §2 제목 ↔ PROGRESS 상태 · T193) + 자기 검사
        run: python3 tools/task_state.py --self-test
      - name: "작업 상태 대조 — 보고만(빨개도 안 막는다 · 결정 493)"
        continue-on-error: true
        run: python3 tools/task_state.py --check
      # T196 — 배포 껍데기(WebGL 템플릿)가 «창을 채우고» «스모크가 알아볼 수 있는» 꼴인가.
      # 되돌리면 다음 빌드가 PC 에서 960×600 상자로 나가거나 T60 이 «로딩 완료» 를 못 본다(빨강 없이 무뎌지는 쪽) —
      # 둘 다 **배포가 깨지는 종류**라 조율 결함(위 «보고만»)과 달리 여기서 막는다(결정 493 의 기준).
      - name: 배포 껍데기 검사 (WebGL 템플릿 · T196) + 자기 검사
        run: |
          python3 tools/check_webgl_template.py --self-test
          python3 tools/check_webgl_template.py
      - name: 오디오 형식 검사 (WebGL 이 읽는 PCM/MP3/AAC 만 · T64)
        run: python3 tools/check_audio_webgl.py
      # T278 — 빨간 런을 읽는 자(T239 실패 목록 + T278 명부)가 **정작 자기 자신은 아무도 안 재고 있었다.**
      # 그 자가 조용히 망가지면 «꼬리에 아무것도 안 찍히는» 꼴이 되는데, 그때는 **런이 이미 빨간 뒤**라
      # 아무도 그 사실을 못 알아챈다(읽으려던 그 순간에 도구가 없다). 순수 함수 자기 검사라 여기서 막는다.
      - name: CI 로그 꼬리 자(명부 + 실패 목록) 자기 검사 (T239·T278)
        run: python3 tools/ci_test_failures.py --self-test
      # T224 5항 ⓐ — 화면에 나가는 한글이 주인 글꼴(Jua)에 **실제로** 있는가(cmap 실측).
      # 런타임 자(TextAudit → TextGlyphs.Missing)로는 구조적으로 못 잡는다: `CanRender` 가
      # «한글 음절 영역이면 참» 이라 11,172자를 다 참이라 하는데 Jua 가 가진 것은 2,367자뿐이다.
      # 없는 글자는 빨강 없이 **폭 0 으로 사라진다** — 무뎌지는 쪽이라 여기서 막는다(결정 493 의 기준).
      - name: 글꼴 글리프 검사 (화면 문자열 ↔ Jua cmap · T224)
        run: python3 tools/check_font_glyphs.py
      # T253 — 아래 셋은 **지시서 §3 이 «게이트» 라 부르면서 CI 어디에서도 안 돌던** 자들이다(실측: ci.yml 0건 · 지시서 4~5곳).
      # 워커가 손으로 돌려 커밋에 «✔» 를 적는 것이 유일한 실행이었는데, 그 방식이 구조적으로 못 잡는 자리가 하나 있다:
      # **리베이스가 뒤에 넣는 어긋남**이다 — 손으로 돌릴 때는 깨끗했는데, 남의 커밋 위로 옮겨 앉으면서 번호가 겹치고
      # 그대로 push 된다(2026-09-08 하루에만 결정 번호 겹침이 다섯 번 넘게 났고 전부 이 꼴이었다).
      # ⚠ **셋 다 일부러 `continue-on-error` 다**(결정 493 의 기준 = «이 자가 빨간 동안 배포된 게임이 못 쓰게 되는가» → 아니다).
      #   번호가 겹치거나 표 행이 어긋난 것은 **조율 결함**이지 빌드 결함이 아니라 주인 폰을 볼모로 잡을 값어치가 없다 —
      #   바로 위 `task_state --check` 가 같은 까닭으로 이미 그렇게 서 있고, 그 자리를 그대로 따른다.
      #   `check_stale_asserts` 는 우연히 같은 글자에 걸리는 일이 잦아(«7f»·«90f» 실례) 더더욱 막는 자로 두면 안 된다.
      # T330 — **자료 손상만 따로 떼어 막는다.** 2026-09-09 하루에 main 에 두 번 실렸다:
      #   PROGRESS.md 3168줄 소실(`0180d5c8` · 복구 `a7c35c3e`) · 풀다 만 충돌 표식 세 줄(`c63abd91` 이 치움).
      # ⚠ 아래 셋과 달리 **`continue-on-error` 가 아니다** — 결정 493 을 어기는 것이 아니라 **잣대가 다른 자리**다.
      #   493 의 물음은 «이 자가 빨간 동안 배포된 게임이 못 쓰게 되는가» 이고 번호 겹침·표 행 어긋남은 아니다.
      #   **자료가 사라진 것은 그 물음의 대상이 아니다** — 물어야 할 것은 «되돌릴 수 있는가» 이고,
      #   아무도 못 알아챈 채 회차가 몇 번 지나가면 되돌릴 자리(직전 커밋)가 묻힌다.
      #   그 대가로 이 자는 **오진할 수 없는 것만** 잡는다(줄 수·백분율 문턱 없음 · 파일 하나만 읽는다).
      - name: 문서가 통째로 깨졌는가 — 막는다 (T330)
        run: python3 tools/check_docs_intact.py
      - name: 문서 손상 자 자기 검사 (T330)
        run: python3 tools/check_docs_intact.py --self-test
      - name: "결정 번호 겹침 — 보고만(빨개도 안 막는다 · 결정 493)"
        continue-on-error: true
        run: python3 tools/check_decisions.py
      - name: "PROGRESS 표 행 어긋남 — 보고만(빨개도 안 막는다 · 결정 493)"
        continue-on-error: true
        run: python3 tools/check_task_rows.py
      - name: "지운 값을 아직 가리키는 테스트 — 보고만(빨개도 안 막는다 · 결정 493)"
        continue-on-error: true
        run: python3 tools/check_stale_asserts.py
      # T347 — lock 은 «작업» 을 잡는데 부딪히는 것은 «파일» 이고, 그 둘을 잇는 것은 표의 «범위» 칸뿐이다.
      #   그 칸이 실제로 여는 파일을 안 적으면 일감을 고르는 워커에게 그 파일은 «비어 있는» 것으로 보인다.
      #   `continue-on-error` 조차 필요 없다 — 이 자는 rc=1 을 낼 갈래가 없다(늘 알리기만 · 결정 493).
      - name: "살아 있는 lock 이 «범위 열에 없는 파일» 을 쥐고 있는가 — 알리기만 (T347)"
        run: python3 tools/check_claim_scope.py
      - name: 선점 범위 자 자기 검사 (T347)
        run: python3 tools/check_claim_scope.py --selftest
      - name: 표 행 이름 ↔ 화면 이름표 대조 자기 검사 (T279)
        run: python3 tools/check_table_tags.py --self-test
      # T282 회차 4 — 그림차 자도 제 자신은 아무도 안 재고 있었다(T278 이 제 자리에 적어 둔 그 꼴).
      # 이 자가 조용히 망가지면 «[그림차] 가 아무 말도 안 하는» 런이 되는데, 그때는 이미 지나간 뒤라
      # 아무도 못 알아챈다. 순수 함수 자기 검사라 여기서 막는다(유니티 잡이 아니라 **이 잡**인 것이 값이다 —
      # 라이선스 사고(T283)처럼 유니티가 통째로 멈춘 동안에도 이 검사는 돈다).
      - name: 그림차 자 자기 검사 (T282)
        run: python3 tools/screens_diff.py --self-test
      # T299 — §5 요약이 «표는 있는데 아무도 안 찍는 화면» 을 세는 눈(`unscored_tables`).
      # 그 눈이 조용히 0 을 돌려주게 되면 **없는 것과 못 찾은 것이 같은 글자**가 되고,
      # 그때는 «안 찍는 표 0개» 라는 초록말만 남는다(그 침묵이 ㊻ 를 스무 시간 숨겼다).
      # 순수 함수라 layout.json 없이 돌고(유니티 잡과 무관) 양쪽을 다 심어 본다 — 여기서 막는다.
      - name: §5 «아무도 안 찍는 표» 자기 검사 (T299)
        run: python3 tools/ui_score.py --selfcheck
      - name: aaaw main 체크아웃 (수치 정본)
        uses: actions/checkout@v4
        with:
          repository: kuzuni/aaaw
          ref: main
          path: .aaaw-src
      - name: data/*.json 동기화 검사
        run: tools/check_data_sync.sh .aaaw-src
      - name: 테스트 결과 Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dotnet-test-results
          path: tools/dotnet/Tests/TestResults/*.trx
          if-no-files-found: ignore
      # ⚑ 이 자는 **layout.json 을 안 본다**(소스와 표만 읽는다) — 그래서 채점보다 먼저,
      #   새 화면이 `screens` 에 오르기 전에도 «맞댈 이름조차 없는 행» 을 말해 준다(T279).
      # ⚑ **이 잡의 마지막 단계다**(결정 769 · T239 의 결정 667 과 같은 까닭) — 처음엔 위쪽
      #   `check_stale_asserts` 옆에 뒀는데, 그 뒤에 오는 aaaw 체크아웃(git 잡음 ~40줄)·아티팩트
      #   업로드가 이 줄을 **꼬리 96줄 밖으로** 밀어냈다(run 606 실측). 워커는 꼬리로만 로그를 읽으므로
      #   «찍히기는 하는데 아무도 못 읽는» 줄이었다. 여기(뒤처리 ~45줄 앞)면 꼬리 50줄에 들어온다.
      # ⚑ `if: always()` — 앞 게이트가 빨개도 이 줄은 찍는다(빨간 런일수록 읽을 값어치가 크다).
      - name: "[표이름] 표 행 이름 ↔ 화면 이름표 어긋남 — 보고만(빨개도 안 막는다 · 결정 493 · 이 잡의 마지막 줄)"
        if: always()
        continue-on-error: true
        run: python3 tools/check_table_tags.py

  gate:
    name: 유니티 시크릿 확인
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      has_license: ${{ steps.check.outputs.has }}
    steps:
      - id: check
        env:
          EM: ${{ secrets.UNITY_EMAIL }}
          PW: ${{ secrets.UNITY_PASSWORD }}
        run: |
          # T283 — UNITY_LICENSE 는 더 이상 안 본다(계정 방식 · 위 unity-test 의 주석).
          if [ -n "$EM" ] && [ -n "$PW" ]; then echo "has=true" >> "$GITHUB_OUTPUT"; echo "유니티 시크릿 있음 → 테스트/빌드 진행";
          else echo "has=false" >> "$GITHUB_OUTPUT"; echo "::notice::UNITY_EMAIL/UNITY_PASSWORD 시크릿이 없어 유니티 단계를 건너뛴다 (README «해야 할 일» 참조)"; fi

  unity-test:
    name: Unity EditMode + PlayMode 테스트
    needs: [dotnet, gate]
    if: needs.gate.outputs.has_license == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      - uses: actions/cache@v4
        with:
          path: Library
          key: Library-test-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            Library-test-
            Library-
      - uses: game-ci/unity-test-runner@v4
        id: tests
        env:
          # T283 — UNITY_LICENSE(.ulf 파일) 를 일부러 안 준다. 주면 game-ci 가 «file» 방식을 골라 그 파일이
          #   «TimeStamp validation failed» 로 거절되고(2026-09-09 열다섯 판), 빼면 «personal(계정)» 방식으로
          #   런마다 새로 활성화해 통한다(탐침 런 license-probe #1 · 388/388). 되살리지 마라.
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: .
          testMode: all
          artifactsPath: unity-test-results
          # T295 — 「빈 값으로 **명시**해야» 체크 런을 안 만든다. 안 적는 것으로는 못 막는다:
          #   unity-test-runner@v4 의 action.yml 이 `githubToken: default: '${{ github.token }}'` 이라
          #   **입력을 빼면 러너가 제 토큰을 스스로 채운다**(실측 — 아래 「왜 이 한 줄인가」).
          #   그 토큰엔 checks:write 가 없어 createCheck 가 던지고 → core.setFailed → **자가 다 초록인데 잡이 빨강**.
          # 왜 여태 안 보였나 — 러너 소스의 갈래가
          #     if ((exitCode === 0 || exitCode === 2) && githubToken) { createCheck(...) }
          #     else if (exitCode !== 0) { setFailed(`Test run failed with exit code ${exitCode}`) }
          #   라서 **테스트가 하나라도 빨가면 이 자리에 닿지도 않는다.** 즉 이 고장은 «전부 초록인 런» 에서만 난다 —
          #   런 618 이후 처음 전부 초록이 된 런 682 에서야 처음 드러났다. 빈 토큰이면 두 갈래가 다 거짓이라 조용히 초록이다.
          # ⚠ 이 한 줄만 믿지 않는다 — **위 permissions 의 `checks: write` 와 둘이 한 벌**이다(T295).
          #   까닭: 「`with:` 에 빈 문자열을 적으면 «준 것» 인가 «안 준 것» 인가」 — 즉 action.yml 의 default 로
          #   되돌아가는가를 **이 컨테이너에서는 검증할 길이 없다**(Actions 러너가 있어야 안다).
          #   그래서 두 갈래를 다 막았다: 빈 값이 먹으면 체크 런을 아예 안 만들어 초록이고,
          #   default 로 되돌아가 러너가 제 토큰을 채우면 이번엔 checks:write 가 있어 createCheck 가 성공해 초록이다.
          #   틀린 쪽을 골랐을 때의 값이 «워커 열둘이 한 시간 더 빨강을 본다» 라, 줄 하나를 아끼는 것보다 크다.
          githubToken: ''
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unity-test-results
          path: ${{ steps.tests.outputs.artifactsPath }}
      # T13 — PlayMode PerkStripTests 가 특전 12개를 얻은 전투 HUD 를 PNG 로 남긴다(주인이 내려받아 «하단 줄이 안 겹치는지» 확인 · 레포엔 커밋 안 함)
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: perkstrip-screens
          path: perkstrip-screens/
          if-no-files-found: ignore
      # T46 — UI 비평 하니스: PlayMode UiShotsTests 가 남긴 전 화면 PNG(540×1170) + layout.json 을 «screens» 브랜치로(main push).
      # 워커는 `git fetch origin screens && git show origin/screens:01_lobby.png > /tmp/01_lobby.png` 로 받아 본다. PNG 커밋 금지 규칙의 유일한 예외 = 이 브랜치(main 에는 절대 안 넣는다).
      #
      # T185 — «테스트가 초록일 때만» 을 **풀었다**(2026-09-07 10:2X · 워커 B · 결정은 PROGRESS T185 행).
      # 까닭: 워커 열둘이 몇 분 간격으로 밀고 커밋마다 새 PlayMode 단언이 붙어 «아무 하나라도 빨가면» PNG 가 통째로 안 나간다.
      # 실측 = screens 가 06:41(run 283) 이후 **4시간** 멈췄고, 그 사이 워커 A 의 T133 이 «CI 초록» 만으로 닫혔다가
      # PNG 가 흐른 뒤에야 «화면에선 여전히 안 보인다» 로 되돌아왔다(결정 403). 이 브랜치는 **진단용 그림**이지 배포물이 아니다.
      # ⚠ gh-pages(주인 폰)는 **안 건드렸다** — 그쪽은 `build-webgl` 의 `needs: [unity-test]` 가 지킨다(빨간 빌드를 폰으로 보내지 않는다).
      # ⚠ force_orphan 이라 «빈 폴더 배포» 는 지난 PNG 를 지운다 → 아래에서 PNG 개수를 세어 0 이면 배포하지 않는다.
      - name: screens 브랜치용 meta.json (커밋 sha · CI 런 번호)
        id: shots
        # T134 — 수동 실행(workflow_dispatch)도 같이 돈다: 워커 12명이 몇 분 간격으로 밀면 대기 런이 계속 밀려 취소돼
        # «최신 트리를 담은 런이 하나도 없는» 상태가 생기는데, 그때 사람이 미는 유일한 지렛대가 수동 실행이다(결정 379).
        # `!cancelled()` = 테스트가 빨개도 돌지만, 런이 «취소» 된 경우(뒤 push 가 밀어냈다)에는 반쪽 결과를 안 올린다.
        if: ${{ !cancelled() && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main' }}
        run: |
          # T57 — unity-test-runner 는 docker(root) 로 돌아 ui-screens/ 와 그 안 PNG·layout.json 이 root 소유로 남는다 → 러너 셸(runner)이 «Permission denied»(CI #82). 소유자를 되돌린 뒤 쓴다.
          mkdir -p ui-screens
          sudo chown -R "$(id -u):$(id -g)" ui-screens
          shots=$(find ui-screens -maxdepth 1 -name '*.png' | wc -l)
          echo "count=$shots" >> "$GITHUB_OUTPUT"
          echo "[T185] ui-screens PNG $shots 장 (0 이면 배포하지 않는다 — force_orphan 이라 지난 PNG 가 지워진다)"
          printf '{"sha":"%s","run":%s,"run_id":%s,"utc":"%s","tests":"%s","shots":%s}\n' "$GITHUB_SHA" "$GITHUB_RUN_NUMBER" "$GITHUB_RUN_ID" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" "${{ steps.tests.outcome }}" "$shots" > ui-screens/meta.json
          ls -la ui-screens
      # T282 — **«이 커밋이 어느 화면 그림을 바꿨나» 를 자가 말한다.** §5 점수(T277)는 이름표의 «자리» 만 재므로
      #   글자가 음절 중간에서 끊기거나(T222) 색·잘림이 달라진 것은 10.0 인 채로 지나간다. 그것을 잡는 유일한 방법이
      #   «전·후 그림 맞대기» 였는데(결정 598) 여태 사람 손이었다.
      # ⚠ **자리 — 이 단계는 아래 «screens 배포» 앞이어야 한다.** 그 배포가 `force_orphan` 으로 옛 그림을 지우므로,
      #   뒤에 두면 견줄 대상이 방금 올린 제 그림이 된다(늘 «바뀐 화면 0»).
      # 재료는 이미 여기 있다: 이 잡이 찍은 `ui-screens/*.png` + 지난 런이 올려 둔 `origin/screens`(얕게 한 번 fetch).
      #   자는 표준 라이브러리만으로 PNG 를 읽는다(러너에 PIL 이 있다고 믿지 않는다 · 실측으로 PIL 과 픽셀까지 같음).
      # **알리기만 한다**(늘 exit 0 · `continue-on-error`) — 그림이 바뀌는 것은 대개 뜻한 변경이라 막을 일이 아니다(결정 740 과 같은 셈).
      - name: "[그림차] 지난 런과 달라진 화면만 짚는다 — 보고만(T282)"
        if: ${{ !cancelled() && steps.shots.outputs.count != '0' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main' }}
        continue-on-error: true
        run: |
          git fetch --no-tags --depth=1 origin +refs/heads/screens:refs/remotes/origin/screens 2>/dev/null || true
          # T282 회차 2 — 이 커밋이 `Assets/` 를 건드렸는지 같이 넘긴다. 안 건드렸는데 그림이 다르면
          # 그것은 «이 커밋이 바꾼 것» 이 아니라 런마다 흔들리는 폭이고, 자가 그 한 줄을 붙인다(6항 실측).
          # 체크아웃이 depth=1 이라 부모가 없다 → 한 칸만 더 받아 본다. 못 받으면 아무 말도 안 한다(unknown).
          ARGS=""
          git fetch --no-tags --depth=2 origin "$GITHUB_SHA" 2>/dev/null || true
          if git rev-parse -q --verify "HEAD^" >/dev/null 2>&1; then
            if git diff --name-only "HEAD^" HEAD -- Assets | grep -q . ; then ARGS="--touched-assets yes"; else ARGS="--touched-assets no"; fi
          fi
          if git rev-parse --verify -q refs/remotes/origin/screens >/dev/null; then
            # `--history diff.json`(회차 3): 지난 런의 폭을 `git show origin/screens:diff.json` 으로 이어받고
            # 이번 값을 더해 `ui-screens/diff.json` 으로 쓴다 → 아래 배포에 같이 실려 다음 런이 또 이어받는다(1KB 남짓).
            python3 tools/screens_diff.py ui-screens --old-ref origin/screens --history diff.json $ARGS > /tmp/screens_diff.txt 2>&1 || true
          else
            echo "[그림차] origin/screens 가 없다(첫 런이거나 브랜치가 아직 없다) — 이번 런은 견줄 옛 그림이 없다." > /tmp/screens_diff.txt
          fi
          cat /tmp/screens_diff.txt
          cat /tmp/screens_diff.txt >> "$GITHUB_STEP_SUMMARY" || true
      - name: "screens 브랜치로 배포 (UI 비평 · ROUTINE §5)"
        # T134 — 수동 실행(workflow_dispatch)도 같이 돈다: 워커 12명이 몇 분 간격으로 밀면 대기 런이 계속 밀려 취소돼
        # «최신 트리를 담은 런이 하나도 없는» 상태가 생기는데, 그때 사람이 미는 유일한 지렛대가 수동 실행이다(결정 379).
        # T185 — 테스트가 빨개도 올리되(위 주석), **PNG 가 한 장도 없으면 올리지 않는다**(force_orphan 이 지난 그림을 지운다).
        if: ${{ !cancelled() && steps.shots.outputs.count != '0' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main' }}
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ui-screens
          publish_branch: screens
          force_orphan: true
          enable_jekyll: false
          commit_message: 'UI 스크린샷 ${{ github.sha }} (CI #${{ github.run_number }})'
      # T277 — **§5 표 점수(`ui_score`)를 CI 가 실제로 센다.** 여태 `grep -n ui_score .github/workflows/*.yml` 이 **0건**이었고,
      # 그 구멍으로 `res_lose` 가 10.0 → 9.3 으로 내려간 것을 아무도 못 봤다(워커 H 실측 — 손으로 돌려 보고서야 알았다).
      # **재료는 이미 이 잡 안에 있다** — 위 단계가 만든 `ui-screens/layout.json` 하나면 된다. «못 돈다» 가 아니라 아무도 안 걸어 둔 것이었다.
      # `--summary` 인 까닭(T277 2항 ⓐ): `--all` 은 **646줄**이라(실측) 그대로 넣으면 아래 T239 의 «실패한 테스트 목록» 을
      #   꼬리 밖으로 도로 밀어낸다 — 그 사고가 T239 회차 1 → 2 의 자기 정정이었다. 요약은 **3줄**이다(실측).
      # 자리(T277 2항 ⓑ): T239 단계가 잡의 «맨 끝» 이어야 하므로 이 자는 그 **바로 앞**이다.
      # **알리기만 한다**(늘 exit 0 · 결정 493 의 «막는 자 ↔ 알리는 자» 기준) — §5 표 여덟(㊱~㊸)은 레퍼런스 그림 없는
      #   «회귀 자» 라 **뜻한 변경도 점수를 떨어뜨린다**(오늘 `res_lose` 가 그랬고 표를 고치니 다시 10.0). 막는 자로 두면 정당한 변경이 막힌다.
      - name: "[§5] 표 점수 요약 — 보고만(빨개도 안 막는다 · T277)"
        if: always()
        run: |
          # ui-screens 는 위 단계에서 이미 소유자를 되돌렸지만, 유니티 잡이 죽어 그 단계를 건너뛴 경우를 위해 한 번 더(실패해도 무시).
          sudo chown -R "$(id -u):$(id -g)" ui-screens 2>/dev/null || true
          if [ -f ui-screens/layout.json ]; then
            python3 tools/ui_score.py --summary ui-screens/layout.json || true
          else
            echo "[§5] ui-screens/layout.json 이 없다 — 유니티 잡이 화면을 못 찍었다(위 단계를 보라). 점수는 이번 런에서 안 센다."
          fi

      # T282 — 위 «그림차» 는 `screens` 배포보다 **앞**에 서야 해서(force_orphan 이 옛 그림을 지운다) 그 줄이
      #   배포 로그 120여 줄에 밀려 꼬리에서 안 보인다. 그래서 그때 적어 둔 것을 여기서 한 번 더 뱉는다 —
      #   워커가 실제로 읽는 자리가 꼬리이기 때문이다(T239 회차 1 → 2 가 배운 것이 바로 이것이다).
      #   ⚠ T239 단계보다 **앞**이어야 한다(`[CI실패] 요약` 이 마지막 줄이라는 계약 · 결정 678).
      - name: "[그림차] 위에서 잰 것을 꼬리에 한 번 더 (T282)"
        if: always()
        run: cat /tmp/screens_diff.txt 2>/dev/null || echo "[그림차] 이번 런은 그림차를 재지 않았다(찍는 단계가 건너뛰었거나 죽었다)."

      # T239 회차 2 — **이 단계는 잡의 «맨 끝» 이어야 한다.** 회차 1 은 아티팩트 업로드 바로 뒤에 뒀는데
      # 그 뒤의 `screens` 배포가 120줄 넘게 찍어 목록을 꼬리 밖으로 밀어냈다(CI #512 실측: tail 130줄로도 못 읽었다).
      # 워커는 아티팩트를 못 내려받고(프록시 · 결정 289) `get_job_logs` 는 꼬리만 준다. 잡은 EditMode → PlayMode 순이라
      # 꼬리의 «Exiting with code 0 (Ok)» 은 **뒤엣것**이고, EditMode 에서 죽으면 꼬리에 «Failed» 가 없다(CI #503: 669KB 에 0건).
      # 이 자는 **알리기만** 한다(늘 exit 0) — 잡을 빨갛게 하는 것은 러너 몫이다.
      # T278 — 같은 자가 **«무엇이 돌았나»(명부)를 먼저**, «무엇이 깨졌나»(실패 목록)를 나중에 찍는다.
      #   까닭: 꼬리가 PlayMode XML 의 **알파벳 앞쪽을 자른다**(682KB 를 당겨도 `M` 앞이 안 잡힌다 · run 579·582·593 실측).
      #   그래서 «새로 세운 자가 이 런에 **실렸는가**» 를 확인할 길이 없었다 — 초록은 «안 깨졌다» 일 뿐 «돌았다» 가 아니다.
      #   명부는 `이름(건수)` 로 촘촘히 붙여 71개가 11줄이다(실측). ⚠ **순서를 뒤집지 마라** —
      #   `[CI실패] 요약` 이 로그의 **마지막 줄**이어야 한다는 계약(결정 678)이 명부를 뒤에 붙이는 순간 깨진다.
      - name: "[T239·T278] 돌아간 자 명부 + 실패한 테스트 이름·메시지를 로그 꼬리에 찍는다(이 단계는 늘 마지막)"
        if: always()
        run: |
          sudo chown -R "$(id -u):$(id -g)" unity-test-results 2>/dev/null || true
          python3 tools/ci_test_failures.py unity-test-results

  build-webgl:
    name: WebGL 빌드 → GitHub Pages (gh-pages)
    needs: [unity-test, gate]
    # T134 — 수동 실행도 포함(결정 379 · 위 screens 배포 단계와 같은 까닭)
    # ⚑ T250(주인 2026-09-09 «그 깃헙 배포 하지 말라 하면 속도 훨씬 빨라지냐» → «그렇게 해 그럼») —
    #   **push 를 뺐다.** 배포는 `deploy-last-green.yml`(T187)이 통째로 맡는다: 스스로 WebGL 을 굽고
    #   배포 스모크(T60)를 돌리고 gh-pages 에 올린 뒤 다시 확인하며, 트리거가 «CI 완료 + 매시 :25» 이고
    #   concurrency 그룹이 달라 이 큐를 안 막는다. 그 자의 «마지막 초록» 고르기는 **유니티 잡**(`test("Unity")`)만
    #   보므로 이 잡이 push 에서 빠져도 판정이 그대로다(실측 확인 · T250).
    #   ⚠ 되돌리려면 아래 줄의 `github.event_name == 'workflow_dispatch'` 를
    #     `(github.event_name == 'push' || github.event_name == 'workflow_dispatch')` 로 되돌린다(그 한 곳뿐).
    #   ⚠ 오디오·로더·빌드 설정을 만진 커밋은 워커가 이 잡을 **수동으로 한 번** 돌린다(3항 ⓒ).
    if: needs.gate.outputs.has_license == 'true' && github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: Library
          key: Library-WebGL-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            Library-WebGL-
            Library-
      - uses: game-ci/unity-builder@v4
        env:
          # T283 — UNITY_LICENSE(.ulf 파일) 를 일부러 안 준다. 주면 game-ci 가 «file» 방식을 골라 그 파일이
          #   «TimeStamp validation failed» 로 거절되고(2026-09-09 열다섯 판), 빼면 «personal(계정)» 방식으로
          #   런마다 새로 활성화해 통한다(탐침 런 license-probe #1 · 388/388). 되살리지 마라.
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: .
          targetPlatform: WebGL
          buildName: KkomaKnight
          buildsPath: build
          allowDirtyBuild: true
      # T60 — 배포 스모크 게이트(주인 상시 지시 2026-09-06 «배포·push 전 에러 확인 · 게임 들어가 봐서 확인»): 빌드를 headless chromium 으로 열어
      # 콘솔 에러 0 · 로딩 완료 · «[KkomaKnight] ready lobby» · DebugGo("battle") → «ready battle» + 10초 에러 0 을 본다. 하나라도 빨강이면 이 step 이 실패해
      # 아래 배포 step 이 돌지 않는다(gh-pages 는 마지막 초록 빌드 유지). 스크린샷·로그는 Artifact «webgl-smoke» 로만(PNG 커밋 금지).
      # 오디오 매체 에러(Vorbis 데이터 «no supported source»·«Unable to decode audio data»)는 T64 가 닫힐 때까지 경고로만 센다(tools/webgl_smoke.js · 결정 110).
      - name: "배포 스모크 (T60 · headless chromium · 콘솔 에러 0 · 로비 · 전투) — 빨강이면 배포 안 함"
        run: |
          sudo chown -R "$(id -u):$(id -g)" build || true
          npm i -g playwright@1.56.1
          npx playwright install --with-deps chromium
          tools/webgl_smoke.sh --dir build/WebGL/KkomaKnight --battle --play-report --require-marker --timeout 240 --shot webgl-smoke/local.png --log webgl-smoke/local.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: webgl-smoke
          path: webgl-smoke/
          if-no-files-found: ignore
      - name: "gh-pages 로 배포 (Settings → Pages → Source: gh-pages, (root))"
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: build/WebGL/KkomaKnight
          publish_branch: gh-pages
          force_orphan: true
          commit_message: 'WebGL 배포 ${{ github.sha }}'
      # T60-2 — 배포 뒤 실제 gh-pages URL 로 한 번 더(경로·캐시·CDN 반영 지연 → 60초 간격 5회 재시도). 여기가 빨강이면 잡은 빨강이지만 배포는 이미 됐다(원인은 Artifact 로그).
      - name: "배포 뒤 gh-pages 재확인 (같은 스모크 · 재시도 5회)"
        run: tools/webgl_smoke.sh https://kuzuni.github.io/aaawunity/ --battle --play-report --require-marker --retries 5 --timeout 240 --shot webgl-smoke/ghpages.png --log webgl-smoke/ghpages.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: webgl-smoke-ghpages
          path: webgl-smoke/ghpages.*
          if-no-files-found: ignore

  build-android:
    name: Android APK 빌드 → Artifact
    needs: [unity-test, gate]
    # T134 — 수동 실행도 포함(결정 379 · 위 screens 배포 단계와 같은 까닭)
    # ⚑ T250(주인 2026-09-09 «그 깃헙 배포 하지 말라 하면 속도 훨씬 빨라지냐» → «그렇게 해 그럼») —
    #   **push 를 뺐다.** 배포는 `deploy-last-green.yml`(T187)이 통째로 맡는다: 스스로 WebGL 을 굽고
    #   배포 스모크(T60)를 돌리고 gh-pages 에 올린 뒤 다시 확인하며, 트리거가 «CI 완료 + 매시 :25» 이고
    #   concurrency 그룹이 달라 이 큐를 안 막는다. 그 자의 «마지막 초록» 고르기는 **유니티 잡**(`test("Unity")`)만
    #   보므로 이 잡이 push 에서 빠져도 판정이 그대로다(실측 확인 · T250).
    #   ⚠ 되돌리려면 아래 줄의 `github.event_name == 'workflow_dispatch'` 를
    #     `(github.event_name == 'push' || github.event_name == 'workflow_dispatch')` 로 되돌린다(그 한 곳뿐).
    #   ⚠ 오디오·로더·빌드 설정을 만진 커밋은 워커가 이 잡을 **수동으로 한 번** 돌린다(3항 ⓒ).
    if: needs.gate.outputs.has_license == 'true' && github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: 디스크 확보 (Android 이미지가 크다)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android/sdk/ndk /opt/ghc /usr/local/.ghcup || true
          df -h /
      - uses: actions/cache@v4
        with:
          path: Library
          key: Library-Android-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            Library-Android-
            Library-
      - uses: game-ci/unity-builder@v4
        env:
          # T283 — UNITY_LICENSE(.ulf 파일) 를 일부러 안 준다. 주면 game-ci 가 «file» 방식을 골라 그 파일이
          #   «TimeStamp validation failed» 로 거절되고(2026-09-09 열다섯 판), 빼면 «personal(계정)» 방식으로
          #   런마다 새로 활성화해 통한다(탐침 런 license-probe #1 · 388/388). 되살리지 마라.
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: .
          targetPlatform: Android
          buildName: KkomaKnight
          buildsPath: build
          androidExportType: androidPackage
          allowDirtyBuild: true
      - uses: actions/upload-artifact@v4
        with:
          name: KkomaKnight-Android-apk
          path: build/Android/*.apk
          if-no-files-found: error
